name: WhatsApp CI

on:
  pull_request:
    paths:
      - 'WhatsApp/**'
      - '.github/workflows/whatsapp-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'WhatsApp/**'
      - '.github/workflows/whatsapp-ci.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe
        run: node --check WhatsApp/bot.js
