name: Portal MPA CI

on:
  pull_request:
    paths:
      - "front/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches:
      - main
    paths:
      - "front/portal/**"
      - ".github/workflows/portal-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
